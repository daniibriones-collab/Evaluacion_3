<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

    <h1>Ejercicio 1</h1>
    <h2>Promedio de notas y asistencia</h2>

    <form action="/ejercicio1" method="POST">

        <label>Nota 1:</label>
        <input type="number" name="nota1"
               min="10" max="70" step="1"
               value="{{ nota1 }}" required>
        <br><br>

        <label>Nota 2:</label>
        <input type="number" name="nota2"
               min="10" max="70" step="1"
               value="{{ nota2 }}" required>
        <br><br>

        <label>Nota 3:</label>
        <input type="number" name="nota3"
               min="10" max="70" step="1"
               value="{{ nota3 }}" required>
        <br><br>

        <label>Asistencia (%):</label>
        <input type="number" name="asistencia"
               min="0" max="100"
               value="{{ asistencia }}" required>
        <br><br>

        <button type="submit">Calcular</button>

    </form>

    {% if promedio is not none %}
        <h3>Resultado</h3>
        <p>Promedio: {{ promedio | round(1) }}</p>
        <p>Estado: {{ estado }}</p>
    {% endif %}

    <hr>

    <a href="/">Volver al menú principal</a>

</body>
</html>
