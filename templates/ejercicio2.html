<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

    <h1>Ejercicio 2</h1>
    <h2>Comparación de nombres</h2>

    <form action="/ejercicio2" method="POST">

        <label>Nombre 1:</label>
        <input type="text" name="nombre1"
               value="{{ nombre1 }}" required>
        <br><br>

        <label>Nombre 2:</label>
        <input type="text" name="nombre2"
               value="{{ nombre2 }}" required>
        <br><br>

        <label>Nombre 3:</label>
        <input type="text" name="nombre3"
               value="{{ nombre3 }}" required>
        <br><br>

        <button type="submit">Enviar</button>

    </form>

    {% if nombre_mayor %}
        <h3>Resultado</h3>
        <p>El nombre con mayor cantidad de caracteres es:
            {{ nombre_mayor }}</p>
        <p>Cantidad de caracteres: {{ cantidad }}</p>
    {% endif %}

    <hr>

    <a href="/">Volver al menú principal</a>

</body>
</html>
